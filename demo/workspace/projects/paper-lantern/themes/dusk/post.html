<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dusk">
  {{> header }}

    <h1>{{ title }}</h1>
    <time datetime="{{ date }}">{{ date }}</time>
    {{ body }}

  {{> footer }}
</body>
</html>
