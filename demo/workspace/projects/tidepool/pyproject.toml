[project]
name = "tidepool"
version = "0.6.0"
description = "Coastal weather sensor pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3",
  "polars>=1.30",
  "streamlit>=1.48",
  "typer>=0.16",
]

[project.scripts]
tidepool = "tidepool.cli:app"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.ruff]
line-length = 100
