<!doctype html>
<html lang="en" class="hq-boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic HQ Widget Library</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' fill='%23060d22'/><path d='M24 6l18 10v16L24 42 6 32V16Z' fill='none' stroke='%23a37cff' stroke-width='3'/></svg>">
<style>@font-face{font-family:Outfit;src:url('/assets/outfit.woff2')}@font-face{font-family:Doto;src:url('/assets/doto.woff2')}</style>
<style>
  /* ============ AGENTIC HQ SKIN (2026-10-28) - the homepage's navy glass world ============
     Tokens copied from os.html's AGENTIC HQ SKIN block and assets/hq-motion.css (not linked).
     Glass is ~20% more transparent than the homepage's 2026-10-27 panels. */
  :root {
    --hq-ink:#d5ddff; --hq-bright:#eef1ff; --hq-dim:#7d88b3; --hq-faint:#717aa7; --hq-dot:#48507a;
    --hq-line:rgba(170,186,255,.12); --hq-line2:rgba(170,186,255,.28);
    --hq-blue:#7fa6ff; --hq-violet:#a37cff; --hq-cyan:#7ff0ff;
    --glass:rgba(8,11,28,.51); --glass-hi:rgba(7,9,22,.72); --well:rgba(4,6,18,.34);
    --accent:var(--hq-violet); --text:var(--hq-ink); --muted:var(--hq-dim);
    --line:var(--hq-line); --linedim:rgba(170,186,255,.08);
    --font-sans:'Outfit','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
    --font-mono:'Cascadia Mono','Cascadia Code',Consolas,ui-monospace,monospace;
    /* type scales with the grid (CELL = innerWidth / 16), not the viewport height */
    --fs-xs:clamp(10px, .55vw, 13px); --fs-s:clamp(11px, .6vw, 14px);
    --fs-m:clamp(12px, .68vw, 16px);
    --r-panel:16px; --r-inner:10px;
    --t1:120ms; --t2:220ms; --ease-in:cubic-bezier(.2,0,0,1);
    --spring:linear(0, .32 8%, .78 18%, 1.03 30%, 1.07 38%, 1.03 50%, .995 65%, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#060d22; }
  body { color:var(--hq-ink); font-family:var(--font-sans); overflow-x:hidden;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(1,3,12,.5) 100%); }
  ::selection { background:rgba(163,124,255,.45); color:#fff; }
  :focus-visible { outline:2px solid var(--hq-cyan); outline-offset:2px; }
  html { scrollbar-width:thin; scrollbar-color:#2a3160 transparent; }
  ::-webkit-scrollbar { width:6px; height:6px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a3160; border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a4380; }
  button { font-family:inherit; }

  #hexbg { position:fixed; inset:0; z-index:0; pointer-events:none; }
  #gridCv { position:absolute; left:0; top:0; z-index:1; pointer-events:none;
    opacity:0; transition:opacity var(--t2) var(--ease-in); }
  body.dragging #gridCv { opacity:1; }
  #board { position:relative; z-index:2; }

  /* ---- widgets: navy glass panels ---- */
  .w { position:absolute; display:flex; flex-direction:column; z-index:10; overflow:hidden;
    transition:left .22s var(--ease-in), top .22s var(--ease-in), width .22s var(--ease-in), height .22s var(--ease-in),
      transform var(--t2) var(--ease-in), border-color var(--t2) var(--ease-in), box-shadow var(--t2) var(--ease-in); }
  .w:not(.chromeless) { background:var(--glass); border:1px solid var(--hq-line); border-radius:var(--r-panel);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); padding:16px;
    box-shadow:0 6px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(180,200,255,.06); }
  body:not(.edit) .w:not(.chromeless):hover { transform:translateY(-2px); border-color:rgba(170,186,255,.22);
    box-shadow:0 12px 32px rgba(0,0,0,.38), inset 0 1px 0 rgba(180,200,255,.09); }
  .w.live { transition:none; z-index:15; transform:scale(1.012); border-color:rgba(163,124,255,.45) !important;
    box-shadow:0 18px 44px rgba(0,0,0,.5), 0 0 0 1px rgba(163,124,255,.35); }

  .wh { display:flex; align-items:center; gap:8px; min-width:0; padding:0 0 16px;
    font:600 var(--fs-s)/1.2 var(--font-sans); letter-spacing:.14em; text-transform:uppercase; color:var(--hq-faint); }
  .wh > span:not(.tick) { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--hq-ink); }
  body.edit .wh { cursor:move; }
  .wh svg.wic { width:16px; height:16px; stroke:var(--hq-blue); fill:none; stroke-width:1.5;
    stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto; filter:drop-shadow(0 0 5px rgba(127,166,255,.45)); }
  .wh .tick { margin-left:auto; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font:400 var(--fs-xs)/1.2 var(--font-mono); letter-spacing:.04em; text-transform:none; color:var(--hq-faint); }
  .wh .pbtn, #restoreRow button { flex:0 0 auto; color:var(--hq-violet); background:rgba(10,13,32,.45);
    border:1px solid rgba(163,124,255,.5); border-radius:999px; padding:6px 12px; cursor:pointer;
    font:500 var(--fs-xs)/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase;
    transition:color var(--t1) var(--ease-in), border-color var(--t1) var(--ease-in), background var(--t1) var(--ease-in); }
  .wh .pbtn:hover, #restoreRow button:hover { color:#e6dcff; background:rgba(163,124,255,.18); border-color:rgba(163,124,255,.75); }
  .wb { flex:1; min-height:0; overflow:hidden; position:relative; }
  body.edit .wb { pointer-events:none; opacity:.6; }
  .why { font-size:var(--fs-m); color:var(--hq-dim); line-height:1.5; margin-bottom:8px; }

  /* edit chrome */
  .wx { position:absolute; top:12px; right:12px; z-index:5; width:24px; height:24px; padding:5px;
    background:rgba(10,13,32,.7); border:1px solid var(--hq-line); border-radius:999px; color:var(--hq-dim);
    cursor:pointer; display:none; }
  .wx svg { width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; pointer-events:none; display:block; }
  body.edit .wx { display:block; animation:hqPop .2s var(--spring) both; }
  .wx:hover { color:#ff8a7d; border-color:rgba(255,90,74,.5); }
  body.edit .w:not(.chromeless) .pbtn { margin-right:32px; }
  .rs { position:absolute; right:6px; bottom:6px; width:14px; height:14px; display:none; cursor:nwse-resize;
    border-right:2px solid var(--hq-violet); border-bottom:2px solid var(--hq-violet); border-radius:0 0 6px 0; z-index:6; }
  body.edit .rs { display:block; animation:hqPop .2s var(--spring) both; }
  @keyframes hqPop { from { transform:scale(.4); opacity:0; } to { transform:none; opacity:1; } }

  /* ---- title: the homepage brand mark and dock ---- */
  #w-title { justify-content:center; }
  #w-title .tb { text-align:center; padding:8px; width:100%; }
  #w-title h1 { display:inline-flex; align-items:center; justify-content:center; gap:16px; white-space:nowrap;
    font:600 clamp(18px, 1.15vw, 30px)/1 var(--font-mono); letter-spacing:.26em; text-transform:uppercase;
    color:var(--hq-bright); text-shadow:0 0 24px rgba(127,166,255,.25); }
  #w-title h1 .hexlogo { display:none; }
  #w-title h1::before { content:''; width:10px; height:10px; border-radius:50%; flex:0 0 auto;
    background:var(--hq-blue); box-shadow:0 0 12px var(--hq-blue); }
  #w-title h1 span { color:var(--hq-blue); font-weight:600; letter-spacing:.26em; }
  #w-title .sub { margin-top:8px; font:400 var(--fs-s)/1.4 var(--font-mono); letter-spacing:.04em; color:var(--hq-dim); }
  .tbar { display:inline-flex; justify-content:center; gap:2px; padding:4px; margin-top:12px;
    background:rgba(8,11,28,.4); border:1px solid var(--hq-line); border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    box-shadow:0 6px 24px rgba(0,0,0,.3), inset 0 1px 0 rgba(180,200,255,.06); }
  .tbar button { width:32px; height:32px; padding:8px; border:1px solid transparent; border-radius:999px;
    background:transparent; cursor:pointer; transition:background var(--t1) var(--ease-in); }
  .tbar button svg { width:100%; height:100%; stroke:var(--hq-dim); fill:none; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; transition:stroke var(--t1) var(--ease-in); display:block; }
  .tbar button:hover { background:rgba(120,150,255,.14); }
  .tbar button:hover svg { stroke:var(--hq-ink); }
  body.edit #editBtn { background:rgba(163,124,255,.16); box-shadow:0 0 12px rgba(163,124,255,.35); }
  body.edit #editBtn svg { stroke:var(--hq-violet); }
  body.edit #resetBtn { display:block !important; }
  #restoreRow { display:none; justify-content:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  body.edit #restoreRow { display:flex; }

  /* ---- the rules strip body ---- */
  .rgrid { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px 24px; }
  .rgrid .it { font-size:var(--fs-m); line-height:1.5; color:var(--hq-dim); padding:8px 0;
    border-bottom:1px solid var(--linedim); display:flex; gap:8px; min-width:0; }
  .rgrid .it b { color:var(--hq-ink); font-weight:600; }
  .rgrid .it i { color:var(--hq-violet); font:500 var(--fs-xs)/1.9 var(--font-mono); font-style:normal; flex:0 0 auto; }

  /* ---- HORIZONTAL MICRO APPS: 4 rounded-rect icon buttons in a row ---- */
  .happ { display:flex; gap:16px; height:100%; align-items:stretch; }
  .happ a { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    border:1px solid var(--hq-line); border-radius:12px; text-decoration:none; color:var(--hq-ink); cursor:pointer;
    background:rgba(10,13,32,.4); box-shadow:inset 0 1px 0 rgba(180,200,255,.05);
    transition:border-color var(--t1) var(--ease-in), background var(--t1) var(--ease-in), transform var(--t2) var(--ease-in); }
  .happ a:hover { border-color:rgba(163,124,255,.45); background:rgba(163,124,255,.08); transform:translateY(-2px); }
  .happ a span { width:40px; height:40px; border-radius:12px; display:grid; place-items:center;
    background:rgba(127,166,255,.09); border:1px solid rgba(127,166,255,.2); }
  .happ svg { width:20px; height:20px; stroke:var(--hq-blue); fill:none; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; transition:stroke var(--t1) var(--ease-in); }
  .happ a:hover svg { stroke:var(--hq-violet); }
  .happ b { font:600 var(--fs-xs)/1 var(--font-sans); letter-spacing:.14em; text-transform:uppercase; color:var(--hq-dim); }
  .happ a:hover b { color:var(--hq-ink); }

  /* ---- preview bodies (exhibits): a recessed well inside the panel ---- */
  .prev { background:var(--well); border:1px solid var(--linedim); border-radius:var(--r-inner);
    padding:12px 16px; pointer-events:none; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.25); }
  .bignum { font:600 clamp(24px, 1.5vw, 36px)/1 var(--font-sans); color:var(--hq-bright);
    font-variant-numeric:tabular-nums; }
  .cap { font:500 var(--fs-xs)/1.5 var(--font-mono); color:var(--hq-dim); letter-spacing:.08em; margin-top:4px; }
  .cap b { color:var(--hq-ink); font-weight:600; }
  #w-x-new .cap { font:400 var(--fs-m)/1.6 var(--font-sans); letter-spacing:0; }
  .prow { display:flex; align-items:center; gap:8px; min-width:0; font-size:var(--fs-m); padding:8px 0;
    border-bottom:1px solid var(--linedim); }
  .prow:last-child { border-bottom:0; }
  .prow .nm { font-weight:500; color:var(--hq-ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .rt { margin-left:auto; flex:0 0 auto; font:500 var(--fs-xs)/1 var(--font-mono); letter-spacing:.08em; color:var(--hq-faint); }
  .prow .rt:first-child { margin-left:0; }
  .prow .lead { flex:0 0 auto; font:600 var(--fs-xs)/1 var(--font-mono); letter-spacing:.08em; color:var(--hq-violet);
    border:1px solid rgba(163,124,255,.5); border-radius:999px; padding:3px 8px; }
  .mini { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mini .mk { background:rgba(10,13,32,.5); border:1px solid var(--hq-line); border-radius:8px; padding:8px 12px; min-width:0; }
  .mini .mk .n { font-size:var(--fs-m); font-weight:600; color:var(--hq-ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini .mk .n i { color:var(--hq-violet); font-style:normal; }
  .mini .mk .c { font:500 var(--fs-xs)/1 var(--font-mono); letter-spacing:.08em; color:var(--hq-faint); margin-top:4px; }
  .clock { font:600 clamp(22px, 1.4vw, 34px)/1 var(--font-sans); color:var(--hq-bright); font-variant-numeric:tabular-nums; }
  .wheelprev { display:grid; place-items:center; padding:4px 0; }
  .wheelprev svg { width:72px; height:72px; stroke:var(--hq-violet); fill:none; stroke-width:1.75;
    filter:drop-shadow(0 0 8px rgba(163,124,255,.35)); }
  .dots { display:flex; gap:6px; margin-top:12px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:var(--hq-dot); }
  .dots i.on { background:var(--hq-blue); box-shadow:0 0 6px rgba(127,166,255,.6); }

  /* ---- prompt popup: glass card ---- */
  #ov { position:fixed; inset:0; z-index:100; background:rgba(1,2,7,.55); display:none; place-items:center; }
  #ov.show { display:grid; animation:hqFade .18s var(--ease-in); }
  #pop { width:min(680px, 92vw); background:var(--glass-hi); border:1px solid var(--hq-line); border-radius:var(--r-panel);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:24px 32px 32px; color:var(--hq-ink);
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(180,200,255,.06); }
  #ov.show #pop { animation:hqCardIn .24s var(--ease-in) .04s both; }
  #pop .pk { font:600 var(--fs-xs)/1 var(--font-mono); letter-spacing:.14em; color:var(--hq-blue); text-transform:uppercase; }
  #pop h2 { font:600 22px/1.2 var(--font-sans); color:var(--hq-bright); margin:8px 0; }
  #pop .pi { font-size:13px; color:var(--hq-dim); line-height:1.6; margin-bottom:16px; max-width:62ch; }
  #pop pre { background:rgba(4,6,18,.6); border:1px solid var(--hq-line); border-radius:var(--r-inner); padding:16px;
    font:400 12px/1.65 var(--font-mono); color:var(--hq-ink); white-space:pre-wrap;
    max-height:300px; overflow:auto; margin-bottom:24px; scrollbar-width:thin; scrollbar-color:#2a3160 transparent; }
  #pop .row { display:flex; gap:8px; }
  #pop .copy, #pop .x { border-radius:999px; font:500 12px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase;
    padding:12px 24px; cursor:pointer; transition:color var(--t1) var(--ease-in), border-color var(--t1) var(--ease-in), background var(--t1) var(--ease-in); }
  #pop .copy { flex:1; color:var(--hq-violet); background:rgba(163,124,255,.08); border:1px solid rgba(163,124,255,.5); }
  #pop .copy:hover { color:#e6dcff; background:rgba(163,124,255,.2); border-color:rgba(163,124,255,.75); }
  #pop .x { color:var(--hq-dim); background:rgba(10,13,32,.55); border:1px solid var(--hq-line); }
  #pop .x:hover { color:var(--hq-ink); border-color:var(--hq-line2); background:rgba(120,150,255,.14); }

  /* ---- the one authored moment: panels rise in once per load ---- */
  .hq-boot #hexbg { animation:hqFade .7s var(--ease-in) both; }
  .hq-boot .w { animation:hqRise .5s var(--ease-in) both; animation-delay:calc(.12s + var(--bi,0) * 32ms); }
  @keyframes hqFade { from { opacity:0; } }
  @keyframes hqRise { from { opacity:0; transform:translateY(8px); } }
  @keyframes hqCardIn { from { opacity:0; transform:scale(.97) translateY(8px); } }

  @media (prefers-reduced-motion: reduce) {
    .hq-boot #hexbg, .hq-boot .w, #ov.show { animation:hqFade .12s linear both !important; animation-delay:0s !important; }
    #ov.show #pop, body.edit .wx, body.edit .rs { animation:none !important; }
    .w, .happ a, #gridCv { transition-duration:.01s !important; }
    body:not(.edit) .w:not(.chromeless):hover, .happ a:hover, .w.live { transform:none; }
  }
</style>
</head>
<body>
<canvas id="hexbg"></canvas>
<canvas id="gridCv"></canvas>
<div id="board"></div>

<div id="ov"><div id="pop">
  <div class="pk">Send to your agent</div>
  <h2 id="popT">Widget</h2>
  <div class="pi">Copy this prompt and paste it into your agent. It names the board file and the rules, so the widget lands looking native.</div>
  <pre id="popP"></pre>
  <div class="row"><button class="copy" id="popCopy">COPY PROMPT</button>
    <button class="x" id="popX">CLOSE</button></div>
</div></div>

<script>
/* ================= grid (the OS's geometry, on a tall scrollable canvas) ============ */
const COLS = 16;
let CELL = Math.floor(innerWidth / COLS);
const px = c => c * CELL + 5, py = r => r * CELL + 5;

const DEF = {
  widgets: [
    { id:'w-title',  c:5,  r:0,  cs:6,  rs:2, kind:'title' },
    { id:'w-rules',  c:1,  r:2,  cs:14, rs:2 },
    { id:'w-x-new',  c:2,  r:4,  cs:12, rs:2 },
    { id:'w-happ',   c:2,  r:6,  cs:8,  rs:2 },
    { id:'w-x-apps', c:10, r:6,  cs:4,  rs:3 },
    { id:'w-x-cal',  c:2,  r:9,  cs:4,  rs:3 },
    { id:'w-x-yt',   c:6,  r:9,  cs:4,  rs:3 },
    { id:'w-x-mail', c:10, r:9,  cs:4,  rs:3 },
    { id:'w-x-rt',   c:2,  r:12, cs:4,  rs:3 },
    { id:'w-x-sk',   c:6,  r:12, cs:4,  rs:3 },
    { id:'w-x-wheel',c:10, r:12, cs:4,  rs:3 }
  ],
  removed: []
};
const LKEY = 'os-widlib-v2';   /* v2: centered + ADD YOUR OWN WIDGET on top */
const LAY = Object.assign(JSON.parse(JSON.stringify(DEF)),
  JSON.parse(localStorage.getItem(LKEY) || '{}'));
const save = () => localStorage.setItem(LKEY, JSON.stringify(LAY));

/* ================= widget definitions ================= */
const BOARD_PATH = 'os.html (in this OS folder)';
const promptFor = (name, size, data, extra) =>
`Add the ${name} widget to the Agentic HQ main board.

Board: ${BOARD_PATH} (served by node server.js in the same folder, at the port in os-config.json).
Rules: follow THE WIDGET RULES card at the top of the widget library (/widgets) exactly - boxless editorial chrome, header anatomy, orange-only accent, real data. Register the widget in DEFLAY and its body in APPBODIES the way the existing widgets do.
Size: ${size} on the 16-column grid.
Data: ${data}
${extra}
Verify before finishing: open the OS headless - zero console errors, every button live, content stays inside the widget box. Do not touch TWDEF, storage keys, or any other widget.`;

const APPS_H = [
  { n:'GALLERY', url:'http://localhost:PORT/your-app',
    ic:'<rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 16l5-4 4 3 5-5 4 4"/>' },
  { n:'NOTES', url:'http://localhost:PORT/another-app',
    ic:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 8h10M7 12h7"/><path d="M12 16v4M8 20h8"/>' },
  { n:'FLOWS', url:'http://localhost:PORT/third-app',
    ic:'<circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7 7.5l3.5 8M17 7.5l-3.5 8"/>' },
  { n:'CONSOLE', url:'http://localhost:PORT/fourth-app',
    ic:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/>' },
];

const WIDGETS = {
  'w-title': { kind:'title' },
  'w-rules': { name:'THE WIDGET RULES', ic:'<path d="M9 11l2 2 4-5"/><rect x="3" y="3" width="18" height="18" rx="2"/>',
    tick:'every widget follows these',
    body:`<div class="rgrid">
      <div class="it"><i>01</i><span><b>Boxless chrome.</b> 2px cream rule, 88px orange hover underline.</span></div>
      <div class="it"><i>02</i><span><b>One accent.</b> Orange only; cream text, muted labels.</span></div>
      <div class="it"><i>03</i><span><b>Header anatomy.</b> icon &rarr; tracked name &rarr; live tick.</span></div>
      <div class="it"><i>04</i><span><b>Type scale.</b> 32px orange bignums, 10px caps, 9px sync foot.</span></div>
      <div class="it"><i>05</i><span><b>4x3 default.</b> content scales, never reflows.</span></div>
      <div class="it"><i>06</i><span><b>Real data only.</b> /api/* or add the endpoint.</span></div>
      <div class="it"><i>07</i><span><b>Rows are links.</b> one primary action max.</span></div>

    tick:'on board', prompt:['MICRO APPS', '4 x 3', 'static rows; each row carries its data-url to a real local app.',

    body:`<div class="why">Vertical launcher - rows open the real localhost tools.</div>

  'w-x-cal': { name:'CALENDAR', ic:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

    body:`<div class="prev" style="cursor:pointer"><div class="cap" style="text-align:center; padding:16px 0"><b>Click here</b> to get your starter prompt.<br>Describe your widget - your agent builds it to the board's rules.</div></div>` },

/* ================= build ================= */
const board = document.getElementById('board');
const els = {};
function buildWidgets() {
  board.innerHTML = '';
  LAY.widgets.forEach((w, bi) => {
    const def = WIDGETS[w.id]; if (!def) return;
    const el = document.createElement('div');
    el.style.setProperty('--bi', bi);
    el.className = 'w' + (def.kind === 'title' ? ' chromeless' : '');
    el.id = w.id;
    if (def.kind === 'title') {
      el.innerHTML = `<div class="wh tb" style="display:block">
        <h1><svg class="hexlogo" viewBox="0 0 48 48" fill="none" stroke="#a37cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="7"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(-24 24 24)" opacity="0.7"/><circle cx="41" cy="16" r="2.5" fill="currentColor" stroke="none"/></svg>AGENTIC HQ <span>Widget Library</span></h1>
        <div class="sub">copy a prompt &middot; paste it to your agent &middot; it lands on the board</div>
        <div class="tbar">
          <button id="editBtn" title="Edit layout"><svg viewBox="0 0 24 24"><path d="M17 3l4 4L8 20l-5 1 1-5Z"/></svg></button>
          <button id="homeBtn" title="Back to the OS"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg></button>
          <button id="resetBtn" title="Reset layout" style="display:none"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2 6"/><path d="M4 5v5h5"/></svg></button>
        </div>
        <div id="restoreRow"></div></div>`;
    } else {
      el.innerHTML = `<div class="wh"><svg class="wic" viewBox="0 0 24 24">${def.ic}</svg>
        <span>${def.name}</span><span class="tick">${def.tick || ''}</span>
        <button class="pbtn" data-p="${w.id}">COPY PROMPT</button></div>
        <div class="wb">${def.body}</div>
        <button class="wx" title="Remove" aria-label="Remove widget"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="rs"></div>`;
    }
    board.appendChild(el);
    els[w.id] = el;
  });
  document.getElementById('editBtn').onclick = () => document.body.classList.toggle('edit');
  document.getElementById('homeBtn').onclick = () => location.href = '/';
  document.getElementById('resetBtn').onclick = () => { localStorage.removeItem(LKEY); location.reload(); };
  document.querySelectorAll('.pbtn').forEach(b => {
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.onclick = e => { e.stopPropagation(); openPrompt(b.dataset.p); };
  });
  /* the ADD YOUR OWN WIDGET card opens its starter prompt from anywhere on the card */
  const nw = els['w-x-new'];
  if (nw) {
    const zone = nw.querySelector('.wb');
    zone.addEventListener('pointerdown', e => e.stopPropagation());
    zone.style.cursor = 'pointer';
    zone.onclick = () => openPrompt('w-x-new');
  }
  document.querySelectorAll('.happ a').forEach(a => {
    a.addEventListener('pointerdown', e => e.stopPropagation());
    a.onclick = e => { e.preventDefault(); window.open(a.dataset.url, '_blank'); };
  });
  renderRestore();
  applyLayout();
}
function applyLayout() {
  LAY.widgets.forEach(w => {
    const el = els[w.id]; if (!el) return;
    el.style.left = px(w.c) + 'px'; el.style.top = py(w.r) + 'px';
    el.style.width = (w.cs * CELL - 10) + 'px'; el.style.height = (w.rs * CELL - 10) + 'px';
  });
  boardHeight();
}
function boardHeight() {
  /* the canvas grows with the layout - scroll as far as the widgets go */
  const maxR = Math.max(8, ...LAY.widgets.map(w => w.r + w.rs)) + 3;
  board.style.height = (maxR * CELL) + 'px';
  drawGrid(maxR);
  drawHex();
}
function renderRestore() {
  const row = document.getElementById('restoreRow');
  row.innerHTML = LAY.removed.map(r => `<button data-res="${r.id}">+ ${WIDGETS[r.id]?.name || r.id}</button>`).join('');
  row.querySelectorAll('button').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = LAY.removed.findIndex(x => x.id === b.dataset.res);
    const w = LAY.removed.splice(i, 1)[0];
    LAY.widgets.push(w);
    pushDown(w);
    save(); buildWidgets();
  });
}

/* ================= edit: drag / resize / remove ================= */
let drag = null;
document.addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('edit')) return;
  if (e.target.closest('#editBtn') || e.target.closest('#homeBtn') || e.target.closest('#restoreRow')) return;
  const wEl = e.target.closest('.w'); if (!wEl) return;
  const w = LAY.widgets.find(x => x.id === wEl.id); if (!w) return;
  if (e.target.classList.contains('wx')) {
    LAY.widgets = LAY.widgets.filter(x => x !== w);
    LAY.removed.push(w);
    save(); buildWidgets(); return;
  }
  if (e.target.classList.contains('rs')) {
    drag = { w, el: wEl, mode:'resize' };
  } else if (e.target.closest('.wh')) {
    const r = wEl.getBoundingClientRect();
    drag = { w, el: wEl, mode:'move', ox: e.clientX - r.left, oy: e.clientY - r.top + scrollY };
  } else return;
  wEl.classList.add('live');
  document.body.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const { w, el } = drag;
  if (drag.mode === 'move') {
    el.style.left = (e.clientX - drag.ox) + 'px';
    el.style.top = (e.clientY + scrollY - (drag.oy - scrollY) - scrollY + scrollY - drag.oy + scrollY) + 'px';
    /* simpler: recompute from page coords */
    el.style.top = (e.pageY - drag.oy) + 'px';
    w.c = Math.max(0, Math.min(COLS - w.cs, Math.round((e.clientX - drag.ox - 5) / CELL)));
    w.r = Math.max(0, Math.round((e.pageY - drag.oy - 5) / CELL));
  } else {
    const r = el.getBoundingClientRect();
    el.style.width = Math.max(CELL - 10, e.clientX - r.left) + 'px';
    el.style.height = Math.max(CELL - 10, e.pageY - (r.top + scrollY)) + 'px';
    w.cs = Math.max(2, Math.min(COLS - w.c, Math.round((e.clientX - r.left + CELL / 2) / CELL)));
    w.rs = Math.max(1, Math.round((e.pageY - (r.top + scrollY) + CELL / 2) / CELL));
  }
});
function pushDown(moved) {
  /* widgets never overlap: whoever the dropped widget lands on slides down,
     and anyone THEY land on slides down after them */
  let guard = 0, again = true;
  while (again && guard++ < 80) {
    again = false;
    for (const a of LAY.widgets) for (const b of LAY.widgets) {
      if (a === b) continue;
      const hit = a.c < b.c + b.cs && b.c < a.c + a.cs && a.r < b.r + b.rs && b.r < a.r + a.rs;
      if (!hit) continue;
      let pushee = a === moved ? b : b === moved ? a : (a.r >= b.r ? a : b);
      if (pushee === moved) pushee = a === moved ? b : a;
      const other = pushee === a ? b : a;
      pushee.r = other.r + other.rs;
      again = true;
    }
  }
}
document.addEventListener('pointerup', () => {
  if (!drag) return;
  drag.el.classList.remove('live');
  document.body.classList.remove('dragging');
  pushDown(drag.w);
  drag = null;
  save(); applyLayout();
});
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('ov').classList.remove('show');
    document.body.classList.remove('edit');
  }
});

/* ================= prompt popup ================= */
let curPrompt = '';
function openPrompt(id) {
  const def = WIDGETS[id];
  curPrompt = def.blank
    ? promptFor('[describe your widget - e.g. SUBSTACK: subscribers, open rate, last send]',
        '4 x 3 (default)', 'describe the source; add a server.js endpoint if none fits.',
        'Replace the bracketed line with what you want on the board, then paste.')
    : promptFor(...def.prompt);
  document.getElementById('popT').textContent = def.name;
  document.getElementById('popP').textContent = curPrompt;
  document.getElementById('ov').classList.add('show');
}
document.getElementById('popCopy').onclick = e => {
  navigator.clipboard.writeText(curPrompt);
  e.target.textContent = 'COPIED ✓';
  setTimeout(() => e.target.textContent = 'COPY PROMPT', 1400);
};
document.getElementById('popX').onclick = () => document.getElementById('ov').classList.remove('show');
document.getElementById('ov').addEventListener('pointerdown', e => {
  if (e.target === document.getElementById('ov')) document.getElementById('ov').classList.remove('show');
});

/* ================= backdrops ================= */
function drawHex() {
  /* Agentic HQ backdrop, as on the homepage: navy field, two soft glows and a seeded
     starfield, so it looks the same on every load */
  const cv = document.getElementById('hexbg'), g = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio, 2);
  const W = innerWidth, H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.clearRect(0, 0, W, H);
  const glow = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(6,13,34,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
  glow(W * .18, H * .12, Math.max(W, H) * .55, 'rgba(70,60,160,.16)');
  glow(W * .85, H * .9, Math.max(W, H) * .5, 'rgba(40,90,170,.12)');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.round(W * H / 9000);
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, r = rnd() < .9 ? .6 : 1.1, a = .12 + rnd() * .4;
    g.fillStyle = rnd() < .2 ? `rgba(163,124,255,${a})` : `rgba(200,212,255,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
}
function drawGrid(rows) {
  const cv = document.getElementById('gridCv'), g = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio, 2);
  const W = innerWidth, H = rows * CELL;
  cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  g.strokeStyle = 'rgba(170,186,255,.09)'; g.lineWidth = 1;
  for (let c = 0; c <= COLS; c++) { g.beginPath(); g.moveTo(c * CELL, 0); g.lineTo(c * CELL, H); g.stroke(); }
  for (let r = 0; r <= rows; r++) { g.beginPath(); g.moveTo(0, r * CELL); g.lineTo(W, r * CELL); g.stroke(); }
}
addEventListener('resize', () => { CELL = Math.floor(innerWidth / COLS); applyLayout(); });
buildWidgets();
/* the boot rise runs once per load, not on every rebuild */
setTimeout(() => document.documentElement.classList.remove('hq-boot'), 1400);
</script>
